name: iOS Build Check

on:
  push:
    branches: [main]
    tags: ['v*']
    # Client source, dependencies, regressions, and build inputs only.
    # Tag pushes and workflow_dispatch remain explicit build/release entry points.
    paths:
      - 'Feather/**'
      - 'Feather.xcodeproj/**'
      - 'Feather.xcworkspace/**'
      - 'Feather.xcconfig'
      - 'AltSourceKit/Package.swift'
      - 'AltSourceKit/Sources/**'
      - 'NimbleKit/Package.swift'
      - 'NimbleKit/Sources/**'
      - 'Zsign'
      - 'IDeviceKitten'
      - '.gitmodules'
      - 'Makefile'
      - 'license_plist.yml'
      - 'Tests/**.swift'
      - 'scripts/check_ios_build.sh'
      - 'scripts/find_release_artifact.py'
      - 'scripts/prepare_github_release.py'
      - 'Tests/test_release_artifact.py'
      - 'Tests/GitHubReleaseRegression.py'
      - 'scripts/test_download_manager_simulator.py'
      - 'scripts/test_update_manager.py'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Feather/**'
      - 'Feather.xcodeproj/**'
      - 'Feather.xcworkspace/**'
      - 'Feather.xcconfig'
      - 'AltSourceKit/Package.swift'
      - 'AltSourceKit/Sources/**'
      - 'NimbleKit/Package.swift'
      - 'NimbleKit/Sources/**'
      - 'Zsign'
      - 'IDeviceKitten'
      - '.gitmodules'
      - 'Makefile'
      - 'license_plist.yml'
      - 'Tests/**.swift'
      - 'scripts/check_ios_build.sh'
      - 'scripts/find_release_artifact.py'
      - 'scripts/prepare_github_release.py'
      - 'Tests/test_release_artifact.py'
      - 'Tests/GitHubReleaseRegression.py'
      - 'scripts/test_download_manager_simulator.py'
      - 'scripts/test_update_manager.py'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: iOS Release build
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check Xcode and iOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')
          test "$XCODE_MAJOR" -ge 26
          xcodebuild -showsdks | grep iphoneos

      - name: Build iOS Release
        env:
          BUILD_OUTPUT: ${{ runner.temp }}/signos-ios-build
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            bash scripts/check_ios_build.sh "$BUILD_OUTPUT" --package-ipa
          else
            bash scripts/check_ios_build.sh "$BUILD_OUTPUT"
          fi

      - name: Upload release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SignOs-ci-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signos-ios-build/SignOs.ipa
            ${{ runner.temp }}/signos-ios-build/build-metadata.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SignOs-build-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signos-ios-build/build.log
            ${{ runner.temp }}/signos-ios-build/Build.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Find verified main build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find_release_artifact.py "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Download verified IPA
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release

      - name: Verify release assets and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_github_release.py release "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Publish IPA and checksums
        uses: softprops/action-gh-release@v2
        with:
          name: SignOs ${{ github.ref_name }}
          body_path: release/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/SignOs.ipa
            release/build-metadata.json
            release/SHA256SUMS
