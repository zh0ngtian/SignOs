name: iOS Build Check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: iOS Release build
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check Xcode and iOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')
          test "$XCODE_MAJOR" -ge 26
          xcodebuild -showsdks | grep iphoneos

      - name: Run release tooling regressions
        run: python3 Tests/GitHubReleaseRegression.py

      - name: Run Swift regressions
        run: |
          set -euo pipefail
          for TEST in OneViewPhase SourceRepositoryIdentity SourceSubscriptionIdentity SourceMigrationReadiness; do
            BINARY="$RUNNER_TEMP/signos-$TEST"
            xcrun swiftc "Feather/Utilities/$TEST.swift" "Tests/${TEST}Regression.swift" -o "$BINARY"
            "$BINARY"
            rm "$BINARY"
          done

      - name: Run download manager simulator regression
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 scripts/test_download_manager_simulator.py "$SIMULATOR_ID"

      - name: Build and inspect iOS IPA
        env:
          BUILD_OUTPUT: ${{ runner.temp }}/signos-ios-build
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/check_ios_build.sh "$BUILD_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignOs-ci-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signos-ios-build/SignOs.ipa
            ${{ runner.temp }}/signos-ios-build/build-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignOs-build-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signos-ios-build/build.log
            ${{ runner.temp }}/signos-ios-build/Build.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified IPA
        uses: actions/download-artifact@v4
        with:
          name: SignOs-ci-${{ github.sha }}
          path: release

      - name: Verify release assets and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_github_release.py release "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Publish IPA and checksums
        uses: softprops/action-gh-release@v2
        with:
          name: SignOs ${{ github.ref_name }}
          body_path: release/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/SignOs.ipa
            release/build-metadata.json
            release/SHA256SUMS
