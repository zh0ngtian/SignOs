name: Full iOS Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Swift, Python and simulator regressions
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check Xcode and iOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')
          test "$XCODE_MAJOR" -ge 26
          xcodebuild -showsdks | grep iphoneos

      - name: Run Python regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 Tests/GitHubReleaseRegression.py

      - name: Run Swift regressions
        run: |
          set -euo pipefail
          python3 scripts/test_auto_update_check.py
          for TEST in OneViewPhase SourceRepositoryIdentity SourceSubscriptionIdentity SourceMigrationReadiness AppVersion SigningIdentity MachOEntitlements; do
            BINARY="$RUNNER_TEMP/signos-$TEST"
            xcrun swiftc "Feather/Utilities/$TEST.swift" "Tests/${TEST}Regression.swift" -o "$BINARY"
            "$BINARY"
            rm "$BINARY"
          done
          BINARY="$RUNNER_TEMP/signos-source-access"
          xcrun swiftc Feather/Utilities/SourcePolicy.swift \
            Feather/Utilities/SourceRepositoryIdentity.swift \
            Feather/Utilities/SourceSubscriptionIdentity.swift \
            Feather/Backend/Observable/SourceAccessManager.swift \
            Tests/SourceAccessRegression.swift -o "$BINARY"
          "$BINARY"
          rm "$BINARY"
          MODEL="$RUNNER_TEMP/signos-migration-model.momd"
          xcrun momc Feather/Backend/Storage/Feather.xcdatamodeld "$MODEL"
          BINARY="$RUNNER_TEMP/signos-signed-migration"
          xcrun swiftc Feather/Utilities/SigningIdentity.swift Tests/SignedSchemaMigrationRegression.swift -o "$BINARY"
          "$BINARY" "$MODEL"
          rm "$BINARY"
          rm -rf "$MODEL"
          BINARY="$RUNNER_TEMP/signos-cloud-subscription"
          xcrun swiftc Feather/Utilities/CloudSourceAssetRule.swift \
            Feather/Backend/CloudSource/CloudSourceModels.swift \
            Feather/Backend/CloudSource/CloudSourceStore.swift \
            Feather/Backend/CloudSource/CloudSourceCredentials.swift \
            Tests/CloudSourceSubscriptionRegression.swift -o "$BINARY"
          "$BINARY"
          rm "$BINARY"

          BINARY="$RUNNER_TEMP/signos-cloud-management"
          xcrun swiftc Feather/Backend/CloudSource/CloudSourceModels.swift \
            Tests/CloudSourceManagementRegression.swift -o "$BINARY"
          "$BINARY"
          rm "$BINARY"

          BINARY="$RUNNER_TEMP/signos-logs"
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            Feather/Utilities/AppLogStore.swift Feather/Utilities/LogExportFile.swift \
            Tests/AppLogRegression.swift -o "$BINARY"
          "$BINARY"
          rm "$BINARY"

      - name: Run update, download and installation cleanup simulator regressions
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 scripts/test_update_manager.py "$SIMULATOR_ID"
          python3 scripts/test_auto_sign_manager.py "$SIMULATOR_ID"
          python3 scripts/test_download_manager_simulator.py "$SIMULATOR_ID"
          python3 scripts/test_install_cleanup_simulator.py "$SIMULATOR_ID"
