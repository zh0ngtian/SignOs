services:
  source:
    image: nginx:alpine
    container_name: signos-home-source
    restart: unless-stopped
    ports:
      - "15006:15006"
    environment:
      APP_SOURCE_DOMAIN: ${APP_SOURCE_DOMAIN:?set APP_SOURCE_DOMAIN in the private env file}
      APP_SOURCE_REDIRECT_URL: ${APP_SOURCE_REDIRECT_URL:-}
      NGINX_ENVSUBST_FILTER: APP_SOURCE_DOMAIN|APP_SOURCE_REDIRECT_URL
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${HOME_SOURCE_ROOT:?set HOME_SOURCE_ROOT}:/srv/source:ro
      - ${HOME_SOURCE_CERTIFICATES:?set HOME_SOURCE_CERTIFICATES}:/certificates:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
