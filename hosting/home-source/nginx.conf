server {
    listen 15006 ssl;
    server_name ${APP_SOURCE_DOMAIN};
    ssl_certificate /certificates/certificates/${APP_SOURCE_DOMAIN}.crt;
    ssl_certificate_key /certificates/certificates/${APP_SOURCE_DOMAIN}.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/source;
    server_tokens off;
    autoindex off;
    sendfile on;
    max_ranges 1;

    location = /source.json {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /source.json =404;
    }
    location = /appstore {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /source.json =404;
    }
    location ~ ^/files/[A-Za-z0-9._-]+\.(ipa|png)$ {
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / { return 404; }
}
